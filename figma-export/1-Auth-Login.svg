  </g>
  <text x="187" y="132" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#0f2918" text-anchor="middle">Trash Detector</text>
  <text x="187" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle" fill="#475569">Masuk untuk mengakses pemindai sampah cerdas</text>
  <g transform="translate(20, 180)">
    <rect width="335" height="520" rx="20" fill="#ffffff" stroke="#cde7d5" stroke-width="1" filter="url(#cardShadow)" />
    <rect x="16" y="16" width="303" height="42" rx="10" fill="#edf7f0" />
    <rect x="18" y="18" width="148" height="38" rx="8" fill="#ffffff" filter="url(#cardShadow)" />
    <text x="92" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#15803d" text-anchor="middle">Masuk (Login)</text>
    <text x="244" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#64748b" text-anchor="middle">Daftar (Register)</text>
    <g transform="translate(16, 76)">
      <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#0f2918">Email atau Username <tspan fill="#ef4444">*</tspan></text>
      <rect x="0" y="24" width="303" height="48" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
      <text x="14" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#0f2918">user@mail.com</text>
    </g>
    <g transform="translate(16, 164)">
      <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#0f2918">Password <tspan fill="#ef4444">*</tspan></text>
      <rect x="0" y="24" width="303" height="48" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
      <text x="14" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#0f2918">••••••••••••</text>
      <text x="272" y="54" font-size="16">👁️</text>
    </g>
    <g transform="translate(16, 258)">
