    </filter>
    <filter id="btnShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#15803d" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="375" height="812" rx="36" fill="#f6fbf7" />
  <rect width="375" height="812" rx="36" fill="none" stroke="#264532" stroke-width="2" opacity="0.4"/>
  <g id="StatusBar" opacity="0.8">
    <text x="32" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0f2918">9:41</text>
    <circle cx="320" cy="27" r="4" fill="#0f2918" />
    <circle cx="332" cy="27" r="4" fill="#0f2918" />
    <rect x="342" y="22" width="18" height="10" rx="3" fill="none" stroke="#0f2918" stroke-width="1.5"/>
    <rect x="344" y="24" width="12" height="6" rx="1.5" fill="#0f2918"/>
  </g>
  <g transform="translate(95, 75)">
