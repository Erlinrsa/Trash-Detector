      <text x="12" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#0f2918">💡 Kredensial Uji Coba Cepat (Slide 5):</text>
      <text x="12" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Email: <tspan font-weight="700">user@mail.com</tspan></text>
      <text x="12" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Password: <tspan font-weight="700">password123</tspan></text>
      <rect x="12" y="74" width="279" height="26" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1" />
      <text x="151" y="91" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#15803d" text-anchor="middle">✓ Isi Kredensial Otomatis</text>
    </g>
    <g transform="translate(16, 460)">
      <text x="151" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">🛡️ Dilindungi Enkripsi Keychain/Keystore (Secure Storage)</text>
    </g>
  </g>
  <rect x="122" y="796" width="130" height="4" rx="2" fill="#0f2918" opacity="0.4"/>
